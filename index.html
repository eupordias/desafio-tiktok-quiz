<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Desafio Criador de Conteúdo 🚀 TikTok Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-dark: #0f1015;
      --card-bg: #191b24;
      --card-border: #282c3c;
      --accent-cyan: #00f2fe;
      --accent-pink: #fe2c55;
      --accent-purple: #7928ca;
      --accent-yellow: #f59e0b;
      --correct: #10b981;
      --correct-bg: rgba(16, 185, 129, 0.15);
      --wrong: #f43f5e;
      --wrong-bg: rgba(244, 63, 94, 0.15);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --radius-sm: 12px;
      --radius-md: 18px;
      --radius-lg: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      padding-bottom: 90px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(254, 44, 85, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 242, 254, 0.08) 0%, transparent 40%);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 16, 21, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 16px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      background: linear-gradient(135deg, #fff, #9ca3af);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-badge span.icon {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-cyan));
      border-radius: 8px;
      padding: 4px 6px;
      font-size: 0.9rem;
      -webkit-text-fill-color: initial;
    }

    .score-badge {
      background: linear-gradient(135deg, rgba(254, 44, 85, 0.2), rgba(0, 242, 254, 0.2));
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50px;
      padding: 4px 12px;
      font-weight: 700;
      font-size: 0.85rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #252836;
      border-radius: 99px;
      margin-top: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-pink), var(--accent-cyan));
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    .main-container {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Student Info Box */
    .student-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .student-card h2 {
      font-size: 1.1rem;
      font-family: 'Outfit', sans-serif;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .student-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .student-input-group {
      display: flex;
      gap: 8px;
    }

    .student-input {
      flex: 1;
      background: #0f1015;
      border: 1px solid #33394d;
      border-radius: var(--radius-sm);
      color: #fff;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .student-input:focus {
      border-color: var(--accent-cyan);
    }

    /* Block filter pill tabs */
    .block-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .block-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      flex-shrink: 0;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent-pink), #e11d48);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 14px rgba(254, 44, 85, 0.4);
    }

    /* Question Cards */
    .question-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 20px;
      margin-bottom: 20px;
      transition: transform 0.2s, border-color 0.2s;
      position: relative;
    }

    .question-card.answered-correct {
      border-color: rgba(16, 185, 129, 0.5);
    }

    .question-card.answered-wrong {
      border-color: rgba(244, 63, 94, 0.5);
    }

    .q-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      gap: 8px;
    }

    .q-num {
      background: #272a38;
      color: var(--accent-cyan);
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .q-block-tag {
      font-size: 0.7rem;
      color: var(--text-muted);
      background: rgba(255,255,255,0.05);
      padding: 4px 8px;
      border-radius: 6px;
    }

    .q-text {
      font-size: 0.98rem;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 14px;
      color: #fff;
    }

    /* Hint Box Components */
    .hint-container {
      margin-bottom: 16px;
    }

    .hint-toggle-btn {
      background: rgba(245, 158, 11, 0.1);
      border: 1px dashed rgba(245, 158, 11, 0.5);
      color: #fbbf24;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .hint-toggle-btn:hover {
      background: rgba(245, 158, 11, 0.2);
      border-color: #fbbf24;
      transform: translateY(-1px);
    }

    .hint-content-box {
      margin-top: 8px;
      background: #14161f;
      border-left: 3px solid #f59e0b;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 10px 12px;
      font-size: 0.82rem;
      color: #fde68a;
      line-height: 1.45;
      display: none;
      animation: fadeIn 0.25s ease;
    }

    .hint-content-box .hint-title {
      font-weight: 800;
      color: #f59e0b;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .hint-content-box mark {
      background: rgba(245, 158, 11, 0.25);
      color: #fff;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 4px;
    }

    /* Options */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background: #12131a;
      border: 1.5px solid #2a2e40;
      border-radius: var(--radius-sm);
      color: #d1d5db;
      padding: 12px 14px;
      font-size: 0.88rem;
      font-family: inherit;
      line-height: 1.35;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      transition: all 0.15s ease;
      position: relative;
    }

    .opt-letter {
      background: #252836;
      color: #9ca3af;
      font-weight: 800;
      font-size: 0.75rem;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent-cyan);
      background: #171924;
      transform: translateY(-1px);
    }

    .option-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    /* Status classes when answered */
    .option-btn.selected-correct {
      background: var(--correct-bg) !important;
      border-color: var(--correct) !important;
      color: #34d399 !important;
      font-weight: 600;
    }
    .option-btn.selected-correct .opt-letter {
      background: var(--correct);
      color: #000;
    }

    .option-btn.selected-wrong {
      background: var(--wrong-bg) !important;
      border-color: var(--wrong) !important;
      color: #fb7185 !important;
    }
    .option-btn.selected-wrong .opt-letter {
      background: var(--wrong);
      color: #fff;
    }

    .option-btn.show-as-correct {
      border-color: var(--correct) !important;
      background: rgba(16, 185, 129, 0.08) !important;
      color: #34d399 !important;
    }

    .option-btn:disabled {
      cursor: default;
      opacity: 0.95;
    }

    /* Explanation popup */
    .explanation-box {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.83rem;
      line-height: 1.4;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .explanation-box.correct {
      background: rgba(16, 185, 129, 0.12);
      border-left: 4px solid var(--correct);
      color: #d1fae5;
    }

    .explanation-box.wrong {
      background: rgba(244, 63, 94, 0.12);
      border-left: 4px solid var(--wrong);
      color: #ffe4e6;
    }

    .explanation-box strong {
      display: block;
      margin-bottom: 4px;
      font-size: 0.88rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Floating / Sticky Footer summary */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 16, 21, 0.95);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--card-border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 680px;
      margin: 0 auto;
      z-index: 99;
    }

    .summary-text {
      font-size: 0.85rem;
      font-weight: 700;
    }

    .btn-finish {
      background: linear-gradient(135deg, var(--accent-pink), #7928ca);
      border: none;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 0.9rem;
      padding: 10px 20px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(254, 44, 85, 0.4);
      transition: transform 0.2s;
    }

    .btn-finish:active {
      transform: scale(0.95);
    }

    /* Results Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: fadeIn 0.2s ease;
    }

    .modal-card {
      background: #191b24;
      border: 1px solid #33394d;
      border-radius: var(--radius-lg);
      max-width: 480px;
      width: 100%;
      padding: 24px 20px;
      text-align: center;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .modal-trophy {
      font-size: 3.5rem;
      margin-bottom: 10px;
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }

    .modal-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      margin-bottom: 6px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .modal-score-big {
      font-size: 2.8rem;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      color: #fff;
      margin: 10px 0;
    }

    .modal-score-big span {
      font-size: 1.2rem;
      color: var(--text-muted);
    }

    .modal-badge-rank {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 50px;
      background: rgba(255,255,255,0.08);
      font-weight: 800;
      font-size: 0.9rem;
      margin-bottom: 16px;
      color: var(--accent-cyan);
      border: 1px solid rgba(0,242,254,0.3);
    }

    .result-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat-item {
      background: #111218;
      border: 1px solid #282c3c;
      padding: 12px;
      border-radius: var(--radius-sm);
    }

    .stat-item .val {
      font-size: 1.2rem;
      font-weight: 800;
      color: #fff;
    }

    .stat-item .lbl {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-share {
      background: #25d366;
      color: #000;
      font-weight: 800;
      font-family: inherit;
      border: none;
      padding: 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.95rem;
    }

    .btn-secondary {
      background: #282c3c;
      color: #fff;
      font-weight: 700;
      border: none;
      padding: 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.88rem;
    }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <header>
    <div class="header-top">
      <div class="logo-badge">
        <span class="icon">📱</span> TikTok Quiz 🚀
      </div>
      <div class="score-badge">
        <span>⭐</span> Pontos: <span id="current-score">0</span> / 40
      </div>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-container">
    
    <!-- Student Name Card -->
    <section class="student-card">
      <h2>👤 Identificação do Aluno(a)</h2>
      <p>Digite seu nome para registrar sua pontuação e gerar seu certificado no final:</p>
      <div class="student-input-group">
        <input type="text" id="student-name" class="student-input" placeholder="Ex: Lucas Silva - 7º Ano B" />
      </div>
    </section>

    <!-- Block navigation tabs -->
    <div class="block-tabs">
      <button class="tab-btn active" onclick="filterBlock('all')">🎯 Todas (40)</button>
      <button class="tab-btn" onclick="filterBlock(1)">🌟 Bloco 1 (1-10)</button>
      <button class="tab-btn" onclick="filterBlock(2)">💰 Bloco 2 (11-20)</button>
      <button class="tab-btn" onclick="filterBlock(3)">🎬 Bloco 3 (21-30)</button>
      <button class="tab-btn" onclick="filterBlock(4)">🛡️ Bloco 4 (31-40)</button>
    </div>

    <!-- Questions Container -->
    <div id="questions-list"></div>

  </main>

  <!-- Bottom Floating Summary Bar -->
  <footer class="bottom-nav">
    <div class="summary-text">
      Respondidas: <span id="answered-count" style="color: var(--accent-cyan)">0</span>/40
    </div>
    <button class="btn-finish" onclick="openResultsModal()">Ver Resultado 🏆</button>
  </footer>

  <!-- Results Modal -->
  <div class="modal-overlay" id="results-modal">
    <div class="modal-card">
      <div class="modal-trophy" id="modal-trophy">🏆</div>
      <h3 class="modal-title" id="modal-title">Incrível!</h3>
      <div class="modal-badge-rank" id="modal-rank">Criador Lendário 🌟</div>
      
      <div class="modal-score-big" id="modal-score-val">
        0 <span>/ 40 acertos</span>
      </div>

      <div class="result-stats">
        <div class="stat-item">
          <div class="val" id="stat-correct" style="color: var(--correct)">0</div>
          <div class="lbl">Acertos ✅</div>
        </div>
        <div class="stat-item">
          <div class="val" id="stat-wrong" style="color: var(--wrong)">0</div>
          <div class="lbl">Erros ❌</div>
        </div>
        <div class="stat-item">
          <div class="val" id="stat-percent">0%</div>
          <div class="lbl">Aproveitamento 📊</div>
        </div>
        <div class="stat-item">
          <div class="val" id="stat-student">Aluno</div>
          <div class="lbl">Nome</div>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-share" onclick="shareToWhatsApp()">
          📲 Enviar Resultado no WhatsApp
        </button>
        <button class="btn-secondary" onclick="closeResultsModal()">
          Revisar Respostas 🔍
        </button>
      </div>
    </div>
  </div>

  <script>
    const questionsData = [
      // BLOCO 1
      {
        id: 1,
        block: 1,
        blockTitle: "Sua Marca Pessoal e Nicho",
        question: "O que é uma \"marca pessoal\" de acordo com o especialista Jay Harrington?",

      },
      {
        id: 3,
        block: 1,
        blockTitle: "Sua Marca Pessoal e Nicho",
        question: "O que significa o \"Why\" (ou o \"Porquê\") criado por Simon Sinek?",
        options: [
          { letter: "a", text: "A quantidade de visualizações que você quer atingir em um mês." },
          { letter: "b", text: "O motivo, o propósito e os valores que inspiram você a criar conteúdo, indo além do que você simplesmente faz." },
          { letter: "c", text: "A ferramenta de edição que você utiliza no celular." },

        hintPhrase: "O verdadeiro segredo dos grandes criadores não é só gravar vídeos, mas sim ter um <mark>motivo, propósito e valores inspiradores</mark> no coração.",

      },
      {
        id: 4,
        block: 1,
        blockTitle: "Sua Marca Pessoal e Nicho",
        question: "O bilionário Warren Buffett tinha pavor de falar em público quando jovem, mas fez um curso e enfrentou o medo. O que esse exemplo nos ensina sobre construir uma marca forte?",
        options: [
          { letter: "a", text: "Que devemos fingir que não temos defeitos para parecer perfeitos." },
          { letter: "b", Que marcas fortes reconhecem suas fraquezas e enfrentam o desconforto para superá-las." },
          { letter: "c", text: "Que quem tem vergonha nunca deve tentar produzir conteúdo." },
          { letter: "d", text: "Que apenas quem nasce sem medo de câmera consegue ter sucesso." }
        ],

    let userAnswers = {};
    let score = 0;
    let currentFilter = 'all';

    function toggleHint(questionId) {
      const hintBox = document.getElementById(`hint-box-${questionId}`);
      const btn = document.getElementById(`hint-btn-${questionId}`);
      if (!hintBox) return;

      if (hintBox.style.display === 'none' || hintBox.style.display === '') {
        hintBox.style.display = 'block';
        btn.innerHTML = '💡 Ocultar Dica 🤫';
      } else {
        hintBox.style.display = 'none';
        btn.innerHTML = '💡 Dica Secreta (Espiar)';
      }
    }

    function renderQuestions() {
      const container = document.getElementById('questions-list');
      container.innerHTML = '';

      questionsData.forEach((q) => {
        const isHidden = currentFilter !== 'all' && q.block !== currentFilter;
        
        const card = document.createElement('div');
        card.className = `question-card ${userAnswers[q.id] ? (userAnswers[q.id].isCorrect ? 'answered-correct' : 'answered-wrong') : ''}`;
        card.id = `q-card-${q.id}`;
        card.style.display = isHidden ? 'none' : 'block';

        let optionsHtml = '';
        q.options.forEach(opt => {
          let btnClass = 'option-btn';
          let disabled = '';

          if (userAnswers[q.id]) {
            disabled = 'disabled';
            if (userAnswers[q.id].selected === opt.letter) {
              btnClass += userAnswers[q.id].isCorrect ? ' selected-correct' : ' selected-wrong';
            } else if (opt.letter === q.answer) {
              btnClass += ' show-as-correct';
            }
          }

          optionsHtml += `
            <button class="${btnClass}" ${disabled} onclick="handleSelect(${q.id}, '${opt.letter}')">
              <span class="opt-letter">${opt.letter.toUpperCase()}</span>
              <span>${opt.text}</span>
            </button>
          `;
        });

        const isAnswered = !!userAnswers[q.id];
        const isCorrect = isAnswered && userAnswers[q.id].isCorrect;

        card.innerHTML = `
          <div class="q-header">
            <span class="q-num">Questão #${q.id}</span>
            <span class="q-block-tag">Bloco ${q.block}</span>
          </div>
          <div class="q-text">${q.question}</div>
          
          <!-- Espaço de Dica Escondida -->
          <div class="hint-container">
            <button type="button" class="hint-toggle-btn" id="hint-btn-${q.id}" onclick="toggleHint(${q.id})">
              💡 Dica Secreta (Espiar)
            </button>
            <div class="hint-content-box" id="hint-box-${q.id}">
              <div class="hint-title">🕵️ Pista Enigmática:</div>
              "${q.hintPhrase}"
            </div>
          </div>

          <div class="options-list" id="opts-${q.id}">
            ${optionsHtml}
          </div>
          <div class="explanation-box ${isCorrect ? 'correct' : 'wrong'}" id="exp-${q.id}" style="${isAnswered ? 'display:block' : 'display:none'}">
            <strong>${isCorrect ? '🎉 Mandou bem! Correto!' : '💡 Ops! Quase lá...'}</strong>
            ${q.explanation}
          </div>
        `;

        container.appendChild(card);
      });
    }

    function handleSelect(questionId, selectedLetter) {
      if (userAnswers[questionId]) return; // already answered

      const q = questionsData.find(item => item.id === questionId);
      const isCorrect = selectedLetter === q.answer;

      userAnswers[questionId] = {
        selected: selectedLetter,
        isCorrect: isCorrect
      };

      if (isCorrect) {
        score++;
        if (typeof confetti === 'function') {
          confetti({
            particleCount: 30,
            spread: 50,
            origin: { y: 0.8 }
          });
        }
      }

      updateUI();
      renderQuestions();
    }

    function updateUI() {
      const answeredCount = Object.keys(userAnswers).length;
      document.getElementById('current-score').innerText = score;
      document.getElementById('answered-count').innerText = answeredCount;

      const pct = (answeredCount / questionsData.length) * 100;
      document.getElementById('progress-bar').style.width = `${pct}%`;

      if (answeredCount === questionsData.length) {
        setTimeout(openResultsModal, 600);
      }
    }

    function filterBlock(blockNum) {
      currentFilter = blockNum;
      document.querySelectorAll('.tab-btn').forEach((btn, index) => {
        btn.classList.remove('active');
        if (blockNum === 'all' && index === 0) btn.classList.add('active');
        if (blockNum === 1 && index === 1) btn.classList.add('active');
        if (blockNum === 2 && index === 2) btn.classList.add('active');
        if (blockNum === 3 && index === 3) btn.classList.add('active');
        if (blockNum === 4 && index === 4) btn.classList.add('active');
      });
      renderQuestions();
    }

    function openResultsModal() {
      const modal = document.getElementById('results-modal');
      const student = document.getElementById('student-name').value.trim() || "Estudante";
      const totalAnswered = Object.keys(userAnswers).length;
      const wrongs = totalAnswered - score;
      const percentage = totalAnswered > 0 ? Math.round((score / totalAnswered) * 100) : 0;

      document.getElementById('modal-score-val').innerHTML = `${score} <span>/ ${questionsData.length} acertos</span>`;
      document.getElementById('stat-correct').innerText = score;
      document.getElementById('stat-wrong').innerText = wrongs;
      document.getElementById('stat-percent').innerText = `${percentage}%`;
      document.getElementById('stat-student').innerText = student.split(' ')[0];

      const trophyEl = document.getElementById('modal-trophy');
      const rankEl = document.getElementById('modal-rank');
      const titleEl = document.getElementById('modal-title');

      if (score >= 35) {
        trophyEl.innerText = "👑";
        titleEl.innerText = "Nível Mestre Supremo!";
        rankEl.innerText = "Influenciador Viral 🌟🌟🌟";
      } else if (score >= 28) {
        trophyEl.innerText = "🚀";
        titleEl.innerText = "Parabéns, Excelente!";
        rankEl.innerText = "Criador em Alta 🔥";
      } else if (score >= 20) {
        trophyEl.innerText = "🎬";
        titleEl.innerText = "Muito Bom!";
        rankEl.innerText = "Criador Promissor 📈";
      } else {
        trophyEl.innerText = "🌱";
        titleEl.innerText = "Continue Praticando!";
        rankEl.innerText = "Iniciante dos Vídeos 💡";
      }

      modal.style.display = 'flex';

      if (score >= 25 && typeof confetti === 'function') {
        confetti({
          particleCount: 100,
          spread: 70,
          origin: { y: 0.6 }
        });
      }
    }

    function closeResultsModal() {
      document.getElementById('results-modal').style.display = 'none';
    }

    function shareToWhatsApp() {
      const student = document.getElementById('student-name').value.trim() || "Aluno(a)";
      const total = questionsData.length;
      const pct = Math.round((score / total) * 100);

      const msg = `🚀 *Desafio Criador de Conteúdo - TikTok Quiz*\n\n` +
                  `👤 *Aluno(a):* ${student}\n` +
                  `✅ *Acertos:* ${score} de ${total} (${pct}%)\n` +
                  `🏆 *Status:* Concluído com sucesso!\n\n` +
                  `_Relatório gerado pelo Quiz Interativo_`;

      const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
      window.open(url, '_blank');
    }

    // Initialize
    window.addEventListener('DOMContentLoaded', () => {
      renderQuestions();
      updateUI();
    });
  </script>
